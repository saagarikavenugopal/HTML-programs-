<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 11</title>
</head>
<body>
    <script>
        function wait2Second(){
            return new Promise(function(resolve){
                setTimeout(function(){
                    resolve("time over");
                }, 2000)
            });
        }
        async function demo(){
            console.log("start");// start, End , time over
            const message = await wait2Second();
            console.log(message);//start , time over, End
            console.log("End");
        }
        demo()
 
    </script>
</body>
</html>
await always tells js -->
pause only this aync function until the promise finishes
