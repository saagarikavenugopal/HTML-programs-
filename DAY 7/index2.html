<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7</title>
    <style>
      @keyframes fadeIn{
        from{
            opacity: 0;
        }
        to{
            opacity: 1;
        }
      }
      h2{
        animation: fadeIn 5s;
      }
      
      .ball{
        width: 80px;
        height: 80px;
        background-color: brown;
        border-radius: 50%;
        animation: bounce 1s infinite;
      }
      @keyframes bounce{
        0%{
            transform: translateY(0);
        }
        50%{
            transform: translateY(-100px);
        }
        100%{
            transform: translateY(0);
        }
      }
      .box{
        width: 120px;
        height: 120px;
        background-color: royalblue;
        animation: spin 2s infinite;
      }
      @keyframes spin{
        from{
            transform: rotate(0deg);
        }
        to{
            transform: rotate(360deg);
        }
      }
      button{
        padding: 15px;
        border: none;
        background:black;
        color: aqua;
        animation: pulse 1s infinite;
      }
      @keyframes pulse{
        0%{
            transform: scale(1);
        }
        50%{
            transform: scale(1.2);
        }
        100%{
            transform: scale(1);
        }
      }
      h2{
        animation: fadeInUp 2s infinite;
      }
      @keyframes fadeInUp{
        from{
            opacity: 0;
            transform: translateY(50px)     
        }
        to{
            opacity: 1;
            transform: translateY(0);
        }
      }
    </style>
</head>
<body>
    <h2>hello students</h2>
    <div class="ball">
    </div>
    <div class="box"></div>
    <br><br>
    <button>subscribe</button>
    <br><br><br>
    <h2>welcome to Css animation</h2>
</body>
</html>
